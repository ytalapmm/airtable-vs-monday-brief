<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Access — Airtable vs. monday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4;
    --card:#FFFFFF;
    --ink:#2B2A2E;
    --ink-soft:#5C5A63;
    --line:#EAE4D8;
    --coral:#FF6B54;
    --coral-deep:#E44E38;
    --teal:#1C9C8E;
    --teal-deep:#127367;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    padding:24px;
  }
  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    padding:36px 32px;
    max-width:360px;
    width:100%;
    box-shadow:0 12px 28px rgba(43,42,46,0.06);
  }
  .eyebrow{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--coral-deep);
    background:#FFE3DC;
    border-radius:999px;
    padding:5px 14px;
    margin-bottom:16px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.4rem;
    margin:0 0 6px 0;
  }
  p.sub{
    margin:0 0 24px 0;
    font-size:0.92rem;
    color:var(--ink-soft);
  }
  label{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:0 0 6px 0;
  }
  input{
    width:100%;
    font-family:'Nunito Sans', sans-serif;
    font-size:0.95rem;
    padding:11px 14px;
    border:2px solid var(--line);
    border-radius:12px;
    margin-bottom:16px;
    background:var(--paper);
    color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--teal);}
  button{
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:#fff;
    background:var(--coral);
    border:none;
    border-radius:999px;
    padding:12px 14px;
    cursor:pointer;
    box-shadow:0 3px 0 var(--coral-deep);
    transform:translateY(0);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--coral-deep);}
  button:disabled{opacity:0.6; cursor:default;}
  .error{
    background:#FFEEE9;
    border:1px solid #F9C6B9;
    color:var(--coral-deep);
    font-size:0.85rem;
    font-weight:600;
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:16px;
    display:none;
  }
  .error.show{display:block;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Private &middot; Internal</span>
    <h1>Airtable vs. monday</h1>
    <p class="sub">Competitive brief — sign in to view.</p>
    <div class="error" id="err">Wrong password.</div>
    <form id="loginForm">
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" autofocus>
      <button type="submit" id="btn">Enter</button>
    </form>
  </div>

  var ITERATIONS = 100000;

  function b64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  var form = document.getElementById('loginForm');
  var input = document.getElementById('p');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.classList.remove('show');

    btn.textContent = 'Checking…';
    try {
      var enc = new TextEncoder();
      var salt = b64ToBytes(SALT_B64);
      var iv = b64ToBytes(IV_B64);
      var data = b64ToBytes(DATA_B64);

      var passKey = await crypto.subtle.importKey('raw', enc.encode(input.value), {name:'PBKDF2'}, false, ['deriveKey']);
      var aesKey = await crypto.subtle.deriveKey(

        passKey,
        {name:'AES-GCM', length:256},
        false,
        ['decrypt']
      );
      var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, aesKey, data);
      var html = new TextDecoder().decode(plainBuf);
      document.open();
      document.write(html);
      document.close();
    } catch (e2) {
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Enter';
    }
  });
})();
</script>
